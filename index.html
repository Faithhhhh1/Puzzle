<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Mother's Day Puzzle</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-family:Arial,sans-serif;
  color:white;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15) 1px, transparent 2px),
    radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12) 1px, transparent 2px),
    radial-gradient(circle at 40% 80%, rgba(255,255,255,0.12) 1px, transparent 2px),
    linear-gradient(to bottom,#020611,#07152f);
  background-size:
    220px 220px,
    260px 260px,
    300px 300px,
    cover;
  padding:20px;
}

h1{
  margin-top:20px;
  margin-bottom:10px;
  text-align:center;
  font-size:56px;
  text-shadow:0 0 15px rgba(255,255,255,0.25);
}

.subtitle{
  color:#d8e0ff;
  margin-bottom:25px;
  font-size:22px;
  text-align:center;
}

.controls{
  display:flex;
  gap:16px;
  margin-bottom:24px;
}

button{
  border:none;
  padding:15px 28px;
  border-radius:14px;
  background:#1a2c68;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 0 20px rgba(120,150,255,0.25);
}

button:hover{
  transform:scale(1.04);
  background:#2946a3;
}

#puzzle{
  width:min(92vw,420px);
  aspect-ratio:3 / 4;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:2px;
  padding:6px;
  background:#111b3d;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 0 35px rgba(110,140,255,0.18);
}

.tile{
  background-image:url("./mom-puzzle.jpg");
  background-size:300% 300%;
  background-repeat:no-repeat;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  padding:8px;
  font-size:38px;
  font-weight:bold;
  color:white;
  text-shadow:
    -2px -2px 0 black,
     2px -2px 0 black,
    -2px  2px 0 black,
     2px  2px 0 black;
  cursor:pointer;
  user-select:none;
  transition:0.15s;
}

.tile:hover{
  filter:brightness(1.06);
}

.empty{
  background:#d9d9d9;
  cursor:default;
}

#moveCounter{
  margin-top:22px;
  font-size:34px;
  font-weight:bold;
}

.message{
  margin-top:18px;
  text-align:center;
  font-size:36px;
  font-weight:bold;
}

.solved-image{
  position:relative;
  width:100%;
  height:100%;
  grid-column:1 / -1;
  grid-row:1 / -1;
}

.solved-image img{
  width:100%;
  height:100%;
  object-fit:fill;
  display:block;
}

.solved-empty{
  position:absolute;
  right:0;
  bottom:0;
  width:33.333%;
  height:33.333%;
  background:#d9d9d9;
}

@media(max-width:600px){
  h1{
    font-size:44px;
  }

  .subtitle{
    font-size:18px;
  }

  button{
    font-size:18px;
    padding:14px 24px;
  }

  .tile{
    font-size:30px;
  }
}
</style>
</head>

<body>

<h1>Mother's Day Puzzle 💖</h1>

<div class="subtitle">
  Slide the pieces into the correct order.
</div>

<div class="controls">
  <button onclick="shufflePuzzle()">Shuffle</button>
  <button onclick="resetPuzzle()">Reset</button>
</div>

<div id="puzzle"></div>

<div id="moveCounter">Moves: 0</div>

<div class="message" id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const puzzle=document.getElementById("puzzle");
const moveCounter=document.getElementById("moveCounter");
const message=document.getElementById("message");

const size=3;

let board=[];
let moves=0;

function updateMoves(){
  moveCounter.textContent=`Moves: ${moves}`;
}

function createPuzzle(){
  puzzle.innerHTML="";

  board.forEach((value,index)=>{
    const tile=document.createElement("div");

    if(value===0){
      tile.className="tile empty";
    }else{
      tile.className="tile";

      const correctIndex=value-1;
      const row=Math.floor(correctIndex/size);
      const col=correctIndex%size;

      tile.style.backgroundPosition=`${col * 50}% ${row * 50}%`;
      tile.textContent=value;
    }

    tile.addEventListener("click",()=>moveTile(index));
    puzzle.appendChild(tile);
  });
}

function moveTile(index){
  const emptyIndex=board.indexOf(0);

  const row=Math.floor(index/size);
  const col=index%size;

  const emptyRow=Math.floor(emptyIndex/size);
  const emptyCol=emptyIndex%size;

  const valid=
    (Math.abs(row-emptyRow)===1 && col===emptyCol) ||
    (Math.abs(col-emptyCol)===1 && row===emptyRow);

  if(valid){
    [board[index],board[emptyIndex]]=[board[emptyIndex],board[index]];

    moves++;

    updateMoves();
    createPuzzle();
    checkWin();
  }
}

function shufflePuzzle(){
  board=[1,2,3,4,5,6,7,8,0];

  for(let i=0;i<300;i++){
    const emptyIndex=board.indexOf(0);

    const row=Math.floor(emptyIndex/size);
    const col=emptyIndex%size;

    const possible=[];

    if(row>0) possible.push(emptyIndex-size);
    if(row<size-1) possible.push(emptyIndex+size);
    if(col>0) possible.push(emptyIndex-1);
    if(col<size-1) possible.push(emptyIndex+1);

    const random=possible[Math.floor(Math.random()*possible.length)];

    [board[random],board[emptyIndex]]=[board[emptyIndex],board[random]];
  }

  moves=0;

  updateMoves();

  message.textContent="";

  createPuzzle();
}

function resetPuzzle(){
  board=[1,2,3,4,5,6,7,8,0];

  moves=0;

  updateMoves();

  message.textContent="";

  createPuzzle();
}

function launchConfetti(){
  if(window.confetti){
    confetti({
      particleCount:220,
      spread:130,
      origin:{y:0.6}
    });
  }
}

function checkWin(){
  const solved=JSON.stringify(board)===JSON.stringify([1,2,3,4,5,6,7,8,0]);

  if(solved){
    puzzle.innerHTML=`
      <div class="solved-image">
        <img src="./mom-puzzle.jpg" alt="Completed Mother's Day puzzle" />
        <div class="solved-empty"></div>
      </div>
    `;

    message.textContent=`You solved it in ${moves} moves! 💕`;

    launchConfetti();
  }
}

shufflePuzzle();
</script>

</body>
</html>
