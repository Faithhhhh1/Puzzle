<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Mother's Day Puzzle</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
  padding:20px;
}

h1{
  margin-bottom:10px;
  font-size:56px;
  text-align:center;
}

.controls{
  margin:20px 0;
  display:flex;
  gap:12px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:black;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.2s ease;
}

button:hover{
  transform:scale(1.05);
}

#puzzle{
  width:450px;
  height:450px;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);

  gap:2px;

  background:#222;

  border:8px solid white;

  box-shadow:0 10px 30px rgba(0,0,0,0.2);

  overflow:hidden;
}

.tile{
  background-image:url('mom-puzzle.jpg');
  background-size:450px 450px;

  display:flex;
  align-items:flex-start;
  justify-content:flex-start;

  padding:8px;

  font-size:42px;
  font-weight:bold;

  color:white;

  text-shadow:
    -2px -2px 0 black,
     2px -2px 0 black,
    -2px  2px 0 black,
     2px  2px 0 black;

  cursor:pointer;

  user-select:none;

  transition:0.15s ease;
}

.tile:hover{
  opacity:0.92;
}

.empty{
  background:#e8e8e8;
  cursor:default;
}

#moveCounter{
  margin-top:14px;
  font-size:20px;
  font-weight:bold;
}

.message{
  margin-top:20px;
  font-size:26px;
  font-weight:bold;
  text-align:center;
}

@media(max-width:520px){

  h1{
    font-size:38px;
  }

  #puzzle{
    width:92vw;
    height:92vw;
  }

  .tile{
    background-size:92vw 92vw;
    font-size:34px;
  }

}

</style>
</head>
<body>

<h1>Mother's Day Puzzle 💖</h1>

<div class="controls">
  <button onclick="shufflePuzzle()">Shuffle</button>
  <button onclick="resetPuzzle()">Reset</button>
</div>

<div id="puzzle"></div>

<div id="moveCounter">Moves: 0</div>

<div class="message" id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const puzzle=document.getElementById('puzzle');
const message=document.getElementById('message');
const moveCounter=document.getElementById('moveCounter');

const size=3;

let board=[];
let moves=0;

function updateMoves(){

  moveCounter.textContent=`Moves: ${moves}`;
}

function renderPuzzle(){

  puzzle.innerHTML='';

  board.forEach((value,index)=>{

    const tile=document.createElement('div');

    if(value===0){

      tile.className='tile empty';

    }else{

      tile.className='tile';

      const correctIndex=value-1;

      const row=Math.floor(correctIndex/size);
      const col=correctIndex%size;

      tile.style.backgroundPosition=
        `-${col*150}px -${row*150}px`;

      tile.textContent=value;
    }

    tile.addEventListener('click',()=>moveTile(index));

    puzzle.appendChild(tile);

  });

}

function createPuzzle(){

  board=[1,2,3,4,5,6,7,8,0];

  moves=0;

  updateMoves();

  message.textContent='';

  puzzle.style.gap='2px';
  puzzle.style.background='#222';

  renderPuzzle();
}

function moveTile(index){

  const emptyIndex=board.indexOf(0);

  const valid=[
    emptyIndex-1,
    emptyIndex+1,
    emptyIndex-size,
    emptyIndex+size
  ];

  const sameRow=
    Math.floor(index/size)===
    Math.floor(emptyIndex/size);

  if(
    valid.includes(index)&&
    (
      sameRow||
      index===emptyIndex-size||
      index===emptyIndex+size
    )
  ){

    [board[index],board[emptyIndex]]=
    [board[emptyIndex],board[index]];

    moves++;

    updateMoves();

    renderPuzzle();

    checkWin();
  }

}

function shufflePuzzle(){

  for(let i=0;i<300;i++){

    const emptyIndex=board.indexOf(0);

    const possible=[];

    const left=emptyIndex-1;
    const right=emptyIndex+1;
    const up=emptyIndex-size;
    const down=emptyIndex+size;

    if(
      left>=0 &&
      Math.floor(left/size)===
      Math.floor(emptyIndex/size)
    ){
      possible.push(left);
    }

    if(
      right<size*size &&
      Math.floor(right/size)===
      Math.floor(emptyIndex/size)
    ){
      possible.push(right);
    }

    if(up>=0) possible.push(up);
    if(down<size*size) possible.push(down);

    const randomMove=
      possible[Math.floor(Math.random()*possible.length)];

    [board[randomMove],board[emptyIndex]]=
    [board[emptyIndex],board[randomMove]];
  }

  moves=0;

  updateMoves();

  renderPuzzle();
}

function resetPuzzle(){

  createPuzzle();

  shufflePuzzle();
}

function launchConfetti(){

  confetti({
    particleCount:180,
    spread:120,
    origin:{y:0.6}
  });

}

function checkWin(){

  const solved=
    JSON.stringify(board)===
    JSON.stringify([1,2,3,4,5,6,7,8,0]);

  if(solved){

    puzzle.innerHTML=`
      <div style="
        position:relative;
        width:100%;
        height:100%;
      ">

        <img
          src="mom-puzzle.jpg"
          style="
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
            background:transparent;
          "
        />

        <!-- empty tile overlay -->
        <div style="
          position:absolute;
          width:33.333%;
          height:33.333%;
          right:0;
          bottom:0;
          background:#f5f5f5;
        "></div>

      </div>
    `;

    puzzle.style.gap='0';
    puzzle.style.background='transparent';

    message.textContent=
      `You solved it in ${moves} moves! 💕`;

    launchConfetti();
  }

}

createPuzzle();
shufflePuzzle();

</script>

</body>
</html>
