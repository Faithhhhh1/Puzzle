<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mother's Day Puzzle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      text-align: center;
    }

    p {
      margin-top: 0;
      color: #555;
      text-align: center;
    }

    .controls {
      margin: 20px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: black;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.03);
    }

    #puzzle {
      width: 450px;
      height: 450px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      background: #222;
      border: 8px solid white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: 0.4s ease;
    }

    .tile {
      background-image: url('mom-puzzle.jpg');
      background-size: 450px 450px;
      cursor: pointer;
      transition: 0.3s ease;

      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;

      font-size: 42px;
      font-weight: bold;
      color: white;

      text-shadow:
        -2px -2px 0 black,
         2px -2px 0 black,
        -2px  2px 0 black,
         2px  2px 0 black;

      padding: 8px;
    }

    .tile:hover {
      opacity: 0.92;
    }

    .empty {
      background: #ddd;
      cursor: default;
    }

    .message {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #222;
      text-align: center;
    }

    #moveCounter {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    @media (max-width: 520px) {
      #puzzle {
        width: 92vw;
        height: 92vw;
      }

      .tile {
        background-size: 92vw 92vw;
      }
    }
  </style>
</head>
<body>

  <h1>Mother's Day Puzzle 💖</h1>
  <p>Slide the pieces into the correct order.</p>

  <div class="controls">
    <button onclick="shufflePuzzle()">Shuffle</button>
    <button onclick="resetPuzzle()">Reset</button>
  </div>

  <div id="puzzle"></div>

  <div id="moveCounter">Moves: 0</div>

  <div class="message" id="message"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const puzzle = document.getElementById('puzzle');
    const message = document.getElementById('message');
    const moveCounter = document.getElementById('moveCounter');

    const size = 3;
    let tiles = [];
    let moves = 0;

    function updateMoves() {
      moveCounter.textContent = `Moves: ${moves}`;
    }

    function createPuzzle() {
      puzzle.innerHTML = '';

      // restore puzzle appearance
      puzzle.style.gap = '2px';
      puzzle.style.background = '#222';

      tiles = [];
      moves = 0;

      updateMoves();

      for (let i = 0; i < size * size; i++) {

        const tile = document.createElement('div');

        tile.classList.add('tile');

        if (i === size * size - 1) {

          tile.classList.add('empty');
          tile.dataset.index = i;

        } else {

          const row = Math.floor(i / size);
          const col = i % size;

          tile.style.backgroundPosition =
            `-${col * 150}px -${row * 150}px`;

          tile.dataset.correct = i;
          tile.dataset.index = i;

          // tile numbers
          tile.textContent = i + 1;
        }

        tile.addEventListener('click', () => moveTile(i));

        tiles.push(tile);
        puzzle.appendChild(tile);
      }
    }

    function moveTile(index) {

      const emptyIndex = tiles.findIndex(t =>
        t.classList.contains('empty')
      );

      const validMoves = [
        emptyIndex - 1,
        emptyIndex + 1,
        emptyIndex - size,
        emptyIndex + size
      ];

      const isAdjacent = validMoves.includes(index);

      const sameRow =
        Math.floor(index / size) ===
        Math.floor(emptyIndex / size);

      if (
        isAdjacent &&
        (
          sameRow ||
          index === emptyIndex - size ||
          index === emptyIndex + size
        )
      ) {

        swapTiles(index, emptyIndex);

        moves++;
        updateMoves();

        checkWin();
      }
    }

    function swapTiles(i1, i2) {

      const tile1 = tiles[i1];
      const tile2 = tiles[i2];

      const clone1 = tile1.cloneNode(true);
      const clone2 = tile2.cloneNode(true);

      clone1.addEventListener('click', () => moveTile(i2));
      clone2.addEventListener('click', () => moveTile(i1));

      puzzle.replaceChild(clone2, tile1);
      puzzle.replaceChild(clone1, tile2);

      [tiles[i1], tiles[i2]] = [clone2, clone1];
    }

    function shufflePuzzle() {

      for (let i = 0; i < 200; i++) {

        const emptyIndex = tiles.findIndex(t =>
          t.classList.contains('empty')
        );

        const possible = [];

        const left = emptyIndex - 1;
        const right = emptyIndex + 1;
        const up = emptyIndex - size;
        const down = emptyIndex + size;

        if (
          left >= 0 &&
          Math.floor(left / size) ===
          Math.floor(emptyIndex / size)
        ) {
          possible.push(left);
        }

        if (
          right < size * size &&
          Math.floor(right / size) ===
          Math.floor(emptyIndex / size)
        ) {
          possible.push(right);
        }

        if (up >= 0) possible.push(up);
        if (down < size * size) possible.push(down);

        const move =
          possible[Math.floor(Math.random() * possible.length)];

        swapTiles(move, emptyIndex);
      }

      moves = 0;

      updateMoves();

      message.textContent = '';
    }

    function resetPuzzle() {

      createPuzzle();
      shufflePuzzle();

      message.textContent = '';
    }

    function launchConfetti() {

      confetti({
        particleCount: 180,
        spread: 120,
        origin: { y: 0.6 }
      });
    }

    function checkWin() {

  const solved = tiles.every((tile, index) => {

    if (tile.classList.contains('empty')) {
      return index === size * size - 1;
    }

    return Number(tile.dataset.correct) === index;
  });

  if (solved) {

    // remove numbers
    tiles.forEach(tile => {
      tile.textContent = '';
    });

    // remove puzzle grid spacing
    puzzle.style.gap = '0px';
    puzzle.style.background = 'transparent';

    // remove tile borders visually
    tiles.forEach(tile => {
      tile.style.boxShadow = 'none';
      tile.style.border = 'none';
    });

    // KEEP empty tile empty
    const emptyTile = tiles.find(tile =>
      tile.classList.contains('empty')
    );

    emptyTile.style.background = '#f5f5f5';

    message.textContent =
      `You solved it in ${moves} moves! 💕`;

    launchConfetti();
  }
}
    createPuzzle();
    shufflePuzzle();

  </script>

</body>
</html>
