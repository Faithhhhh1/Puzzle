<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Mother's Day Puzzle</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;

  font-family:Arial,sans-serif;

  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15) 1px, transparent 2px),
    radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12) 1px, transparent 2px),
    radial-gradient(circle at 40% 80%, rgba(255,255,255,0.15) 1px, transparent 2px),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,0.12) 1px, transparent 2px),
    linear-gradient(to bottom, #040814, #0b1230);

  background-size:
    220px 220px,
    260px 260px,
    300px 300px,
    180px 180px,
    cover;

  color:white;

  padding:30px;
}

body::before{
  content:'';
  position:fixed;
  inset:0;

  background:
    radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);

  background-size:120px 120px;

  animation:twinkle 6s linear infinite;

  pointer-events:none;
}

@keyframes twinkle{
  0%{opacity:0.5;}
  50%{opacity:1;}
  100%{opacity:0.5;}
}

h1{
  margin-bottom:12px;
  font-size:52px;
  text-align:center;

  text-shadow:
    0 0 10px rgba(255,255,255,0.3),
    0 0 20px rgba(255,255,255,0.15);
}

.subtitle{
  margin-bottom:18px;
  color:#d6dcff;
  text-align:center;
}

.controls{
  display:flex;
  gap:14px;
  margin-bottom:24px;
}

button{
  padding:14px 24px;

  border:none;
  border-radius:14px;

  background:#161d42;

  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  transition:0.2s ease;

  box-shadow:
    0 0 15px rgba(140,160,255,0.15);
}

button:hover{
  transform:translateY(-2px) scale(1.04);

  background:#26336d;

  box-shadow:
    0 0 18px rgba(140,160,255,0.35);
}

#puzzle{

  width:420px;
  height:720px;

  display:grid;

  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);

  gap:2px;

  background:#11182f;

  padding:8px;

  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0 0 35px rgba(110,140,255,0.18),
    0 20px 45px rgba(0,0,0,0.45);
}

.tile{

  background-image:url('mom-puzzle.jpg');

  background-size:420px 720px;

  display:flex;

  align-items:flex-start;
  justify-content:flex-start;

  padding:8px;

  font-size:42px;
  font-weight:bold;

  color:white;

  text-shadow:
    -2px -2px 0 black,
     2px -2px 0 black,
    -2px  2px 0 black,
     2px  2px 0 black;

  cursor:pointer;

  user-select:none;

  transition:0.15s ease;
}

.tile:hover{
  filter:brightness(1.06);
}

.empty{
  background:#d9d9d9;
  cursor:default;
}

#moveCounter{
  margin-top:18px;
  font-size:24px;
  font-weight:bold;

  text-shadow:
    0 0 12px rgba(255,255,255,0.2);
}

.message{
  margin-top:24px;

  font-size:34px;
  font-weight:bold;

  text-align:center;

  text-shadow:
    0 0 18px rgba(255,255,255,0.25);
}

@media(max-width:560px){

  h1{
    font-size:38px;
  }

  #puzzle{
    width:92vw;
    height:158vw;
  }

  .tile{
    background-size:92vw 158vw;
    font-size:34px;
  }

}

</style>
</head>
<body>

<h1>Mother's Day Puzzle 💖</h1>

<div class="subtitle">
  Slide the pieces into the correct order.
</div>

<div class="controls">
  <button onclick="shufflePuzzle()">Shuffle</button>
  <button onclick="resetPuzzle()">Reset</button>
</div>

<div id="puzzle"></div>

<div id="moveCounter">Moves: 0</div>

<div class="message" id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const puzzle=document.getElementById('puzzle');
const message=document.getElementById('message');
const moveCounter=document.getElementById('moveCounter');

const size=3;

let board=[];
let moves=0;

function updateMoves(){

  moveCounter.textContent=`Moves: ${moves}`;
}

function renderPuzzle(){

  puzzle.innerHTML='';

  board.forEach((value,index)=>{

    const tile=document.createElement('div');

    if(value===0){

      tile.className='tile empty';

    }else{

      tile.className='tile';

      const correctIndex=value-1;

      const row=Math.floor(correctIndex/size);
      const col=correctIndex%size;

      tile.style.backgroundPosition=
        `-${col*140}px -${row*240}px`;

      tile.textContent=value;
    }

    tile.addEventListener('click',()=>moveTile(index));

    puzzle.appendChild(tile);

  });

}

function createPuzzle(){

  board=[1,2,3,4,5,6,7,8,0];

  moves=0;

  updateMoves();

  message.textContent='';

  renderPuzzle();
}

function moveTile(index){

  const emptyIndex=board.indexOf(0);

  const valid=[
    emptyIndex-1,
    emptyIndex+1,
    emptyIndex-size,
    emptyIndex+size
  ];

  const sameRow=
    Math.floor(index/size)===
    Math.floor(emptyIndex/size);

  if(
    valid.includes(index)&&
    (
      sameRow||
      index===emptyIndex-size||
      index===emptyIndex+size
    )
  ){

    [board[index],board[emptyIndex]]=
    [board[emptyIndex],board[index]];

    moves++;

    updateMoves();

    renderPuzzle();

    checkWin();
  }

}

function shufflePuzzle(){

  for(let i=0;i<400;i++){

    const emptyIndex=board.indexOf(0);

    const possible=[];

    const left=emptyIndex-1;
    const right=emptyIndex+1;
    const up=emptyIndex-size;
    const down=emptyIndex+size;

    if(
      left>=0 &&
      Math.floor(left/size)===
      Math.floor(emptyIndex/size)
    ){
      possible.push(left);
    }

    if(
      right<size*size &&
      Math.floor(right/size)===
      Math.floor(emptyIndex/size)
    ){
      possible.push(right);
    }

    if(up>=0) possible.push(up);
    if(down<size*size) possible.push(down);

    const randomMove=
      possible[Math.floor(Math.random()*possible.length)];

    [board[randomMove],board[emptyIndex]]=
    [board[emptyIndex],board[randomMove]];
  }

  moves=0;

  updateMoves();

  renderPuzzle();
}

function resetPuzzle(){

  createPuzzle();

  shufflePuzzle();
}

function launchConfetti(){

  confetti({
    particleCount:220,
    spread:140,
    origin:{y:0.6}
  });

}

function checkWin(){

  const solved=
    JSON.stringify(board)===
    JSON.stringify([1,2,3,4,5,6,7,8,0]);

  if(solved){

    puzzle.innerHTML=`
      <div style="
        position:relative;
        width:100%;
        height:100%;
      ">

        <img
          src="mom-puzzle.jpg"
          style="
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
          "
        />

        <!-- Empty tile -->
        <div style="
          position:absolute;
          width:33.333%;
          height:33.333%;
          right:0;
          bottom:0;
          background:#d9d9d9;
        "></div>

      </div>
    `;

    message.textContent=
      `You solved it in ${moves} moves! 💕`;

    launchConfetti();
  }

}

createPuzzle();
shufflePuzzle();

</script>

</body>
</html>
